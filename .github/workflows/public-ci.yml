name: Public CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and build
    if: github.repository == 'michael-samoilov/my151-public'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run lint

      - run: npm test

      - run: npm run build
