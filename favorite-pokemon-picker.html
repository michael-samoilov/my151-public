    <style>
      html { background-color: #f7f7f8; }
      body { margin: 0; background-color: #f7f7f8; color: #0a0a0a;
             font-family: system-ui, -apple-system, sans-serif; }
      html { font-size: clamp(16px, 13px + 0.7vw, 20px); }
      .fv-shell { display: flex; flex-direction: column; min-height: 100dvh; }
      .fv-header { display: flex; align-items: center; justify-content: space-between;
                   height: 2.75rem; box-sizing: border-box;
                   padding: 0 0.75rem; border-bottom: 1px solid #e5e5e5; background: #ffffff; }
      .fv-wordmark { font-size: 1.5rem; line-height: 2rem; font-weight: 800; letter-spacing: -0.025em;
                     color: #0a0a0a; text-decoration: none; white-space: nowrap; }
      .fv-wordmark b { color: #dc2626; font-weight: inherit; }
      .fv-bar { display: flex; align-items: center; height: 2.75rem; box-sizing: border-box;
                padding: 0 0.75rem; border-bottom: 1px solid #e5e5e5; background: #ffffff; }
      .fv-bar h1 { margin: 0; font-size: 0.6875rem; line-height: 1; font-weight: 600; color: #6e6e6e; white-space: nowrap; }
      .fv-copy { max-width: 40rem; margin: 0 auto; padding: 1rem 0.75rem; opacity: 0;
                 animation: fv-reveal 320ms ease-out 1s forwards; }
      .fv-copy p { margin: 0 0 0.5rem; font-size: 0.875rem; line-height: 1.5; color: #525252; }
      @keyframes fv-reveal { to { opacity: 1; } }
    </style>

  <body>
    <div id="root">
      <div class="fv-shell">
        <header class="fv-header">

        </header>
        <div class="fv-bar">
          <h1>Favorite Pokémon Picker</h1>
        </div>
        <main class="fv-copy">
          <p>
            Pick your favorite Pokémon for each type and generation, then choose a favorite from each row and column. Export your chart, or filter Pokémon by your favorites in the Pokédex and gym leader builders.
          </p>
          <p>Loading the picker…</p>
        </main>
      </div>
    </div>
