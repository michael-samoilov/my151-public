    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Favorite Pokémon Picker by Type and Generation",
      "url": "https://my151.app/favorite-pokemon-picker",
      "mainEntityOfPage": "https://my151.app/favorite-pokemon-picker",
      "image": { "@type": "ImageObject", "url": "https://my151.app/search/favorite-pokemon-picker.jpg", "width": 1480, "height": 1480 },
      "description": "Pick your favorite Pokémon of each type and generation. Fill the grid, see detailed stats on which sorts of Pokémon you tend to prefer, then export the full grid or summary view as a PNG. Free, no account.",
      "applicationCategory": "EntertainmentApplication",
      "operatingSystem": "Any",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }

    <style>
      html { background-color: #f7f7f8; }
      body { margin: 0; background-color: #f7f7f8; color: #0a0a0a;
             font-family: system-ui, -apple-system, sans-serif; }
      html { font-size: clamp(16px, 13px + 0.7vw, 20px); }
      .fv-shell { display: flex; flex-direction: column; min-height: 100dvh; }
      .fv-bar { display: flex; align-items: center; height: 2.75rem; box-sizing: border-box;
                padding: 0 0.75rem; border-bottom: 1px solid #e5e5e5; background: #ffffff; }
      .fv-bar h1 { margin: 0; font-size: 0.6875rem; line-height: 1; font-weight: 600; color: #6e6e6e; white-space: nowrap; }
      .fv-copy { max-width: 40rem; margin: 0 auto; padding: 1rem 0.75rem; opacity: 0;
                 animation: fv-reveal 320ms ease-out 1s forwards; }
      .fv-copy p { margin: 0 0 0.5rem; font-size: 0.875rem; line-height: 1.5; color: #525252; }
      /* The served FAQ (scripts/static-faq.ts): one collapsed line under the
       * loading line, revealed with the rest of .fv-copy. */
      .p151-faq summary { cursor: pointer; font-size: 0.6875rem; color: #6e6e6e; text-decoration: underline; text-underline-offset: 2px; }
      .p151-faq > div { display: flex; flex-direction: column; gap: 1rem; padding: 0.5rem 0 1rem; }
      .p151-faq h2 { margin: 0; font-size: 0.8125rem; font-weight: 600; color: #0a0a0a; }
      .fv-copy .p151-faq p { margin: 0.25rem 0 0; font-size: 0.75rem; line-height: 1.625; color: #6e6e6e; }
      @keyframes fv-reveal { to { opacity: 1; } }
      /* The app's one loading mark (src/components/shared/PokeBallSpinner.tsx). */
      .fv-loading { display: flex; align-items: center; gap: 0.5rem; }
      .fv-ball { width: 1.25rem; height: 1.25rem; flex-shrink: 0; animation: fv-spin 1s linear infinite; }
      @keyframes fv-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .fv-ball { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="fv-shell">
        <!-- The app's own header markup and classes (FavoritesApp.tsx,
             GlobalHeader), so the wordmark does not move when the app replaces
             this header. -->
        <header class="flex h-11 items-center justify-between border-b bg-card px-3 sm:px-6">
          <a href="/" class="text-2xl font-extrabold tracking-tight"><span class="text-primary">my151</span><span class="text-foreground">.app</span></a>
        </header>
        <div class="fv-bar">
          <h1>Favorite Pokémon Picker</h1>
        </div>
        <main class="fv-copy">
          <p>
            Pick your favorite Pokémon for each type and generation, then choose a favorite from each row and column. Export your chart, or filter Pokémon by your favorites in the Pokédex and gym leader builders.
          </p>
          <p class="fv-loading"><svg class="fv-ball" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#fafafa" stroke="#dc2626" stroke-width="1.5"/><path d="M2 16 A14 14 0 0 1 30 16" fill="#dc2626"/><line x1="2" y1="16" x2="30" y2="16" stroke="#fafafa" stroke-width="2"/><circle cx="16" cy="16" r="4.5" fill="#fafafa" stroke="#dc2626" stroke-width="2"/></svg>Loading the picker…</p>
          <!-- p151-faq:favorites -->
        </main>
      </div>
    </div>
    <script type="module" src="/src/favorites/main.tsx"></script>
  </body>
</html>
