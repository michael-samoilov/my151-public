<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', 'Inter Variable', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #dc2626; } a:hover { color: #b91c1c; }
    img.sprite { image-rendering: pixelated; }
    .trow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); align-items: center; height: 54px; border-top: 1px solid #f0f0f1; }
    .c { display: flex; align-items: center; justify-content: center; height: 100%; position: relative; }
    .c img { width: 44px; height: 44px; }
    .g { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; justify-content: center; height: 100%; align-content: center; }
    .pbtn { position: absolute; bottom: 2px; width: 15px; height: 15px; border-radius: 999px; background: #ffffff; border: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 800; }
    .band { display: flex; align-items: center; height: 20px; padding-left: 4px; font-size: 9.5px; color: #737373; border-top: 1px solid #e5e5e5; }
    .band b { font-weight: 700; letter-spacing: 0.07em; color: #525252; margin-right: 4px; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #f7f7f8; color: #0a0a0a; overflow: hidden; display: flex; flex-direction: column;">

  <!-- Header 1: global app header, cross-tool nav lives here -->
  <div style="background: #ffffff; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; flex-shrink: 0;">
    <div style="font-size: 20px; font-weight: 800; letter-spacing: -0.025em;"><span style="color: #dc2626;">my151</span><span style="color: #0a0a0a;">.app</span></div>
    <div style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 6px; font-size: 13px; font-weight: 500; color: #0a0a0a;">
      <svg viewBox="0 0 16 16" style="width: 15px; height: 15px;"><rect x="1.5" y="1.5" width="5" height="5" rx="1.2" fill="none" stroke="#0a0a0a" stroke-width="1.5"></rect><rect x="9.5" y="1.5" width="5" height="5" rx="1.2" fill="none" stroke="#0a0a0a" stroke-width="1.5"></rect><rect x="1.5" y="9.5" width="5" height="5" rx="1.2" fill="none" stroke="#0a0a0a" stroke-width="1.5"></rect><rect x="9.5" y="9.5" width="5" height="5" rx="1.2" fill="none" stroke="#0a0a0a" stroke-width="1.5"></rect></svg>
      Tools
    </div>
  </div>

  <!-- Header 2: tool header for the open card -->
  <div style="background: #ffffff; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; gap: 8px; padding: 6px 12px; flex-shrink: 0;">
    <svg viewBox="0 0 16 16" style="width: 18px; height: 18px;"><path d="M10 3 L5 8 L10 13" fill="none" stroke="#737373" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <span style="width: 24px; height: 24px; border-radius: 999px; background: #6390f0; display: flex; align-items: center; justify-content: center;"><img src="11.png" alt="Water" style="width: 15px; height: 15px;"></span>
    <span style="font-size: 14px; font-weight: 700;">Water</span>
    <span style="font-size: 11px; color: #737373;">Weird dual-typing</span>
    <span style="margin-left: auto; display: flex; align-items: center; gap: 10px;">
      <svg viewBox="0 0 16 16" style="width: 16px; height: 16px;"><circle cx="8" cy="8" r="7" fill="none" stroke="#737373" stroke-width="1.4"></circle><circle cx="8" cy="4.8" r="0.9" fill="#737373"></circle><rect x="7.2" y="6.8" width="1.6" height="4.6" rx="0.8" fill="#737373"></rect></svg>
      <svg viewBox="0 0 24 24" style="width: 17px; height: 17px;"><path d="M4 8 L7 8 L9 5 L15 5 L17 8 L20 8 L20 19 L4 19 Z" fill="none" stroke="#737373" stroke-width="1.8" stroke-linejoin="round"></path><circle cx="12" cy="13" r="3.2" fill="none" stroke="#737373" stroke-width="1.8"></circle></svg>
    </span>
  </div>

  <!-- The 11-row card: glyphs sit in the rightmost empty cell, template style -->
  <div style="margin: 10px 12px 0 12px; background: #ffffff; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.06); padding: 4px 8px; position: relative;">

    <!-- Signature panel: 3 columns x 4 rows, from cell A1 -->
    <div style="position: absolute; left: 10px; top: 7px; width: 146px; height: 212px; background: #fafafa; border: 1px solid #f0f0f1; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; z-index: 5;">
      <span style="display: flex; align-items: center; gap: 4px; font-size: 9px; font-weight: 700; letter-spacing: 0.08em; color: #737373;"><svg viewBox="0 0 12 12" style="width: 10px; height: 10px;"><path d="M6 0.5 L7.5 4.4 L11.6 4.4 L8.3 6.9 L9.6 10.9 L6 8.5 L2.4 10.9 L3.7 6.9 L0.4 4.4 L4.5 4.4 Z" fill="#dc2626"></path></svg>SIGNATURE</span>
      <img src="171.png" alt="Lanturn" class="sprite" style="width: 88px; height: 88px;">
      <span style="font-size: 13px; font-weight: 600;">Lanturn</span>
    </div>

    <!-- Gym 1 -->
    <div class="trow" style="border-top: none;">
      <div class="c"></div><div class="c"></div><div class="c"></div>
      <div class="c"><span style="font-size: 9.5px; color: #737373; text-align: right; line-height: 1.2;">No<br>badges</span></div>
      <div class="g"><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 1 L11 6 L6 11 L1 6 Z" fill="none" stroke="#737373" stroke-width="1.6"></path></svg></div>
      <div class="c"><img src="194.png" alt="Wooper" class="sprite"></div>
      <div class="c"><img src="170.png" alt="Chinchou" class="sprite"></div>
    </div>
    <!-- Gym 2 -->
    <div class="trow">
      <div class="c"></div><div class="c"></div><div class="c"></div>
      <div class="g"><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 1 L11 6 L6 11 L1 6 Z" fill="none" stroke="#737373" stroke-width="1.6"></path></svg></div>
      <div class="c"><img src="271.png" alt="Lombre" class="sprite"></div>
      <div class="c"><img src="194.png" alt="Wooper" class="sprite"></div>
      <div class="c"><img src="170.png" alt="Chinchou" class="sprite"></div>
    </div>
    <!-- Gym 3 -->
    <div class="trow">
      <div class="c"></div><div class="c"></div><div class="c"></div>
      <div class="g"><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 1 L11 6 L6 11 L1 6 Z" fill="none" stroke="#737373" stroke-width="1.6"></path></svg></div>
      <div class="c"><img src="271.png" alt="Lombre" class="sprite"></div>
      <div class="c"><img src="195.png" alt="Quagsire" class="sprite"></div>
      <div class="c"><img src="170.png" alt="Chinchou" class="sprite"></div>
    </div>
    <!-- Gym 4 -->
    <div class="trow">
      <div class="c"></div><div class="c"></div><div class="c"></div>
      <div class="g"><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 1 L11 6 L6 11 L1 6 Z" fill="none" stroke="#737373" stroke-width="1.6"></path></svg></div>
      <div class="c"><img src="271.png" alt="Lombre" class="sprite"></div>
      <div class="c"><img src="195.png" alt="Quagsire" class="sprite"></div>
      <div class="c"><img src="171.png" alt="Lanturn" class="sprite"></div>
    </div>
    <!-- Gym 5 -->
    <div class="trow">
      <div class="c"></div><div class="c"></div>
      <div class="g"><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 1 L11 6 L6 11 L1 6 Z" fill="none" stroke="#737373" stroke-width="1.6"></path></svg></div>
      <div class="c"><img src="130.png" alt="Gyarados" class="sprite"></div>
      <div class="c"><img src="271.png" alt="Lombre" class="sprite"></div>
      <div class="c"><img src="195.png" alt="Quagsire" class="sprite"></div>
      <div class="c"><img src="171.png" alt="Lanturn" class="sprite"></div>
    </div>
    <!-- Gym 6 -->
    <div class="trow">
      <div class="c"></div><div class="c"></div>
      <div class="g"><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 1 L11 6 L6 11 L1 6 Z" fill="none" stroke="#737373" stroke-width="1.6"></path></svg></div>
      <div class="c"><img src="130.png" alt="Gyarados" class="sprite"></div>
      <div class="c"><img src="272.png" alt="Ludicolo" class="sprite"></div>
      <div class="c"><img src="195.png" alt="Quagsire" class="sprite"></div>
      <div class="c"><img src="171.png" alt="Lanturn" class="sprite"></div>
    </div>
    <!-- Gym 7 -->
    <div class="trow">
      <div class="c"></div><div class="c"></div>
      <div class="g"><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 1 L11 6 L6 11 L1 6 Z" fill="none" stroke="#737373" stroke-width="1.6"></path></svg></div>
      <div class="c"><img src="130.png" alt="Gyarados" class="sprite"></div>
      <div class="c"><img src="272.png" alt="Ludicolo" class="sprite"></div>
      <div class="c"><img src="195.png" alt="Quagsire" class="sprite"></div>
      <div class="c"><img src="171.png" alt="Lanturn" class="sprite"></div>
    </div>
    <!-- Gym 8 -->
    <div class="trow">
      <div class="c"></div>
      <div class="g" style="max-width: 44px; margin: 0 auto;"><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 1 L11 6 L6 11 L1 6 Z" fill="none" stroke="#737373" stroke-width="1.6"></path></svg></div>
      <div class="c"><img src="131.png" alt="Lapras" class="sprite"></div>
      <div class="c"><img src="130.png" alt="Gyarados" class="sprite"></div>
      <div class="c"><img src="272.png" alt="Ludicolo" class="sprite"></div>
      <div class="c"><img src="195.png" alt="Quagsire" class="sprite"></div>
      <div class="c"><img src="171.png" alt="Lanturn" class="sprite"></div>
    </div>
    <!-- Elite 4 -->
    <div class="trow" style="border-top: 2px solid #e5e5e5;">
      <div class="c"></div>
      <div class="g" style="flex-wrap: nowrap;"><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0.5 L7.5 4.4 L11.6 4.4 L8.3 6.9 L9.6 10.9 L6 8.5 L2.4 10.9 L3.7 6.9 L0.4 4.4 L4.5 4.4 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0.5 L7.5 4.4 L11.6 4.4 L8.3 6.9 L9.6 10.9 L6 8.5 L2.4 10.9 L3.7 6.9 L0.4 4.4 L4.5 4.4 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0.5 L7.5 4.4 L11.6 4.4 L8.3 6.9 L9.6 10.9 L6 8.5 L2.4 10.9 L3.7 6.9 L0.4 4.4 L4.5 4.4 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0.5 L7.5 4.4 L11.6 4.4 L8.3 6.9 L9.6 10.9 L6 8.5 L2.4 10.9 L3.7 6.9 L0.4 4.4 L4.5 4.4 Z" fill="#737373"></path></svg></div>
      <div class="c"><img src="131.png" alt="Lapras" class="sprite"></div>
      <div class="c"><img src="130.png" alt="Gyarados" class="sprite"></div>
      <div class="c"><img src="272.png" alt="Ludicolo" class="sprite"></div>
      <div class="c"><img src="195.png" alt="Quagsire" class="sprite"></div>
      <div class="c"><img src="171.png" alt="Lanturn" class="sprite"></div>
    </div>

    <div class="band"><b>CHAMPION TEAM</b> may include one Mega/Gigantamax</div>
    <div class="trow" style="border-top: none;">
      <div class="g"><svg viewBox="0 0 20 14" width="16" height="12"><path d="M1 13 L2.6 4 L7 8.4 L10 1.5 L13 8.4 L17.4 4 L19 13 Z" fill="#eab308"></path></svg></div>
      <div class="c"><img src="350.png" alt="Milotic" class="sprite"></div>
      <div class="c"><img src="131.png" alt="Lapras" class="sprite"><span class="pbtn" style="right: 1px; color: #db2777;">D</span></div>
      <div class="c"><img src="130.png" alt="Gyarados" class="sprite"><span class="pbtn" style="left: 1px; color: #f97316;">M</span></div>
      <div class="c"><img src="272.png" alt="Ludicolo" class="sprite"></div>
      <div class="c"><img src="195.png" alt="Quagsire" class="sprite"></div>
      <div class="c"><img src="171.png" alt="Lanturn" class="sprite"></div>
    </div>

    <div class="band"><b>ENDGAME BOSS TEAM</b> may also include one minor Legendary</div>
    <div class="trow" style="border-top: none;">
      <div class="g"><svg viewBox="0 0 16 16" width="17" height="17" fill="none"><path d="M1 8 A7 7 0 0 1 15 8" fill="#ef4444" stroke="#ef4444" stroke-width="1.5"></path><path d="M1 8 A7 7 0 0 0 15 8" fill="none" stroke="#ef4444" stroke-width="1.5"></path><line x1="1" y1="8" x2="15" y2="8" stroke="#ef4444" stroke-width="1.5"></line><circle cx="8" cy="8" r="2.5" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"></circle></svg></div>
      <div class="c"><img src="350.png" alt="Milotic" class="sprite"></div>
      <div class="c"><img src="131.png" alt="Lapras" class="sprite"><span class="pbtn" style="right: 1px; color: #db2777;">D</span></div>
      <div class="c"><img src="245.png" alt="Suicune" class="sprite"><svg viewBox="0 0 20 14" style="position: absolute; top: 2px; left: 2px; width: 12px; height: 9px;"><path d="M1 13 L2.6 4 L7 8.4 L10 1.5 L13 8.4 L17.4 4 L19 13 Z" fill="#eab308"></path></svg></div>
      <div class="c"><img src="272.png" alt="Ludicolo" class="sprite"></div>
      <div class="c"><img src="195.png" alt="Quagsire" class="sprite"></div>
      <div class="c"><img src="171.png" alt="Lanturn" class="sprite"></div>
    </div>
  </div>

  <!-- Gesture hint -->
  <div style="margin: 10px 16px 0 16px; display: flex; align-items: center; gap: 8px;">
    <svg viewBox="0 0 16 16" style="width: 13px; height: 13px; flex-shrink: 0;"><path d="M2 8 L14 8 M4.5 5 L2 8 L4.5 11 M11.5 5 L14 8 L11.5 11" fill="none" stroke="#a3a3a3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <span style="font-size: 11px; color: #a3a3a3;">Drag a column to reorder &middot; drag a sprite up or down to shift its evolution</span>
  </div>

</div>
</x-dc>
</body>
</html>
