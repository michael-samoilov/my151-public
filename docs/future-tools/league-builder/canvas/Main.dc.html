<html>

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', 'Inter Variable', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #dc2626; } a:hover { color: #b91c1c; }
    img.sprite { image-rendering: pixelated; }
    .trow { display: grid; grid-template-columns: 40px repeat(6, minmax(0, 1fr)); align-items: center; height: 56px; border-top: 1px solid #f0f0f1; }
    .glyphs { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; padding-left: 6px; max-width: 38px; }
    .c { display: flex; align-items: center; justify-content: center; height: 100%; position: relative; }
    .c img { width: 44px; height: 44px; }
    .dot { width: 6px; height: 6px; border-radius: 999px; background: #ececee; }
    .pbtn { position: absolute; bottom: 2px; width: 15px; height: 15px; border-radius: 999px; background: #ffffff; border: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 800; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #f7f7f8; color: #0a0a0a; overflow: hidden; display: flex; flex-direction: column;">

  <!-- Compact app header -->

    <div style="font-size: 20px; font-weight: 800; letter-spacing: -0.025em;"><span style="color: #dc2626;">my151</span><span style="color: #0a0a0a;">.app</span></div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg viewBox="0 0 16 16" style="width: 18px; height: 18px;"><path d="M10 3 L5 8 L10 13" fill="none" stroke="#737373" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="font-size: 13px; color: #737373;">League</span>
    </div>
  </div>

  <!-- Card identity: type + theme, then signature -->

    <span style="font-size: 15px; font-weight: 700;">Water</span>
    <span style="font-size: 12px; color: #737373;">Weird dual-typing</span>
    <span style="margin-left: auto; width: 26px; height: 26px; border-radius: 999px; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 16 16" style="width: 15px; height: 15px;"><circle cx="8" cy="8" r="7" fill="none" stroke="#737373" stroke-width="1.4"></circle><circle cx="8" cy="4.8" r="0.9" fill="#737373"></circle><rect x="7.2" y="6.8" width="1.6" height="4.6" rx="0.8" fill="#737373"></rect></svg></span>
  </div>
  <div style="display: flex; align-items: center; gap: 6px; padding: 2px 12px 8px 12px;">

    <span style="font-size: 12px; font-weight: 600;">Lanturn</span>
  </div>

  <!-- The 11-row card table, columns right-aligned like the template -->

    <!-- Gym 1 -->

      <div class="glyphs"><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 1 L11 6 L6 11 L1 6 Z" fill="none" stroke="#737373" stroke-width="1.6"></path></svg></div>
      <div class="c"><span class="dot"></span></div><div class="c"><span class="dot"></span></div><div class="c"><span class="dot"></span></div><div class="c"><span class="dot"></span></div>
      <div class="c"><img src="194.png" alt="Wooper" class="sprite"></div>
      <div class="c"><img src="170.png" alt="Chinchou" class="sprite"></div>
    </div>
    <!-- Gym 2 -->

      <div class="c"><span class="dot"></span></div><div class="c"><span class="dot"></span></div><div class="c"><span class="dot"></span></div>
      <div class="c"><img src="271.png" alt="Lombre" class="sprite"></div>
      <div class="c"><img src="195.png" alt="Quagsire" class="sprite"></div>
      <div class="c"><img src="170.png" alt="Chinchou" class="sprite"></div>
    </div>
    <!-- Gym 4 -->
    <div class="trow">
      <div class="glyphs"><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 1 L11 6 L6 11 L1 6 Z" fill="none" stroke="#737373" stroke-width="1.6"></path></svg></div>

    <!-- Gym 5 -->
    <div class="trow">
      <div class="glyphs"><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 1 L11 6 L6 11 L1 6 Z" fill="none" stroke="#737373" stroke-width="1.6"></path></svg></div>

      <div class="c"><span class="dot"></span></div><div class="c"><span class="dot"></span></div>
      <div class="c"><img src="130.png" alt="Gyarados" class="sprite"></div>
      <div class="c"><img src="272.png" alt="Ludicolo" class="sprite"></div>
      <div class="c"><img src="195.png" alt="Quagsire" class="sprite"></div>
      <div class="c"><img src="171.png" alt="Lanturn" class="sprite"></div>
    </div>
    <!-- Gym 7 -->
    <div class="trow">
      <div class="glyphs"><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="7" height="7"><path d="M6 1 L11 6 L6 11 L1 6 Z" fill="none" stroke="#737373" stroke-width="1.6"></path></svg></div>

      <div class="c"><img src="272.png" alt="Ludicolo" class="sprite"></div>

      <div class="c"><span class="dot"></span></div>
      <div class="c"><img src="131.png" alt="Lapras" class="sprite"></div>
      <div class="c"><img src="130.png" alt="Gyarados" class="sprite"></div>
      <div class="c"><img src="272.png" alt="Ludicolo" class="sprite"></div>
      <div class="c"><img src="195.png" alt="Quagsire" class="sprite"></div>
      <div class="c"><img src="171.png" alt="Lanturn" class="sprite"></div>
    </div>
    <!-- Elite 4 -->
    <div class="trow" style="border-top: 2px solid #e5e5e5;">
      <div class="glyphs"><svg viewBox="0 0 12 12" width="8" height="8"><path d="M6 0.5 L7.5 4.4 L11.6 4.4 L8.3 6.9 L9.6 10.9 L6 8.5 L2.4 10.9 L3.7 6.9 L0.4 4.4 L4.5 4.4 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="8" height="8"><path d="M6 0.5 L7.5 4.4 L11.6 4.4 L8.3 6.9 L9.6 10.9 L6 8.5 L2.4 10.9 L3.7 6.9 L0.4 4.4 L4.5 4.4 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="8" height="8"><path d="M6 0.5 L7.5 4.4 L11.6 4.4 L8.3 6.9 L9.6 10.9 L6 8.5 L2.4 10.9 L3.7 6.9 L0.4 4.4 L4.5 4.4 Z" fill="#737373"></path></svg><svg viewBox="0 0 12 12" width="8" height="8"><path d="M6 0.5 L7.5 4.4 L11.6 4.4 L8.3 6.9 L9.6 10.9 L6 8.5 L2.4 10.9 L3.7 6.9 L0.4 4.4 L4.5 4.4 Z" fill="#737373"></path></svg></div>
      <div class="c"><span class="dot"></span></div>
      <div class="c"><img src="131.png" alt="Lapras" class="sprite"></div>
      <div class="c"><img src="130.png" alt="Gyarados" class="sprite"></div>

    </div>
    <!-- Endgame boss -->
    <div class="trow">
      <div class="glyphs"><svg viewBox="0 0 20 14" width="15" height="11"><path d="M1 13 L2.6 4 L7 8.4 L10 1.5 L13 8.4 L17.4 4 L19 13 Z" fill="#eab308"></path></svg></div>
      <div class="c"><img src="350.png" alt="Milotic" class="sprite"></div>
      <div class="c"><img src="131.png" alt="Lapras" class="sprite"><span class="pbtn" style="right: 0; color: #db2777;">D</span></div>

  <!-- Gesture hint -->
