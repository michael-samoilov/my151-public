<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', 'Inter Variable', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #dc2626; } a:hover { color: #b91c1c; }
    img.sprite { image-rendering: pixelated; }
    .linecard { display: flex; align-items: center; gap: 10px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px 14px; }
    .linecard img { width: 52px; height: 52px; }
    .chip { height: 32px; display: flex; align-items: center; padding: 0 12px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #f7f7f8; color: #0a0a0a; overflow: hidden; display: flex; flex-direction: column; position: relative;">

  <!-- Card page peeking behind the sheet -->
  <div style="background: #ffffff; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: space-between; padding: 8px 12px;">
    <div style="font-size: 20px; font-weight: 800; letter-spacing: -0.025em;"><span style="color: #dc2626;">my151</span><span style="color: #0a0a0a;">.app</span></div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg viewBox="0 0 16 16" style="width: 18px; height: 18px;"><path d="M10 3 L5 8 L10 13" fill="none" stroke="#737373" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="font-size: 13px; color: #737373;">League</span>
    </div>
  </div>
  <div style="display: flex; align-items: center; gap: 8px; padding: 8px 12px;">
    <span style="width: 30px; height: 30px; border-radius: 999px; background: #6390f0; display: flex; align-items: center; justify-content: center;"><img src="11.png" alt="Water" style="width: 18px; height: 18px;"></span>
    <span style="font-size: 15px; font-weight: 700;">Water</span>
    <span style="font-size: 12px; color: #737373;">Weird dual-typing</span>
  </div>
  <div style="margin: 0 12px; background: #ffffff; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.06); padding: 4px 8px; height: 120px;"></div>

  <!-- Dim veil -->
  <div style="position: absolute; inset: 0; background: rgba(10, 10, 10, 0.35);"></div>

  <!-- Bottom sheet: the evo line selector -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 640px; background: #f7f7f8; border-radius: 16px 16px 0 0; box-shadow: 0 -4px 24px rgba(0,0,0,0.18); display: flex; flex-direction: column; padding: 8px 12px 16px 12px;">
    <div style="width: 36px; height: 4px; border-radius: 999px; background: #d4d4d4; margin: 2px auto 10px auto;"></div>

    <!-- Search -->
    <div style="display: flex; align-items: center; gap: 8px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; height: 40px; padding: 0 12px;">
      <svg viewBox="0 0 16 16" style="width: 14px; height: 14px;"><circle cx="7" cy="7" r="5" fill="none" stroke="#737373" stroke-width="1.6"></circle><line x1="11" y1="11" x2="14.5" y2="14.5" stroke="#737373" stroke-width="1.6" stroke-linecap="round"></line></svg>
      <span style="font-size: 14px;">eevee</span>
      <span style="width: 1.5px; height: 16px; background: #0a0a0a;"></span>
    </div>

    <!-- Filters -->
    <div style="display: flex; gap: 6px; margin: 10px 0;">
      <div class="chip" style="background: #dc2626; color: #ffffff;">My 151</div>
      <div class="chip" style="background: #ffffff; border: 1px solid #e5e5e5; color: #171717;">Water</div>
      <div class="chip" style="background: #ffffff; border: 1px solid #e5e5e5; color: #171717;">All types</div>
    </div>

    <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #737373; margin: 2px 0 8px 2px;">3 EVOLUTION LINES</div>

    <!-- Branch-grouped line cards: one card per branch -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div class="linecard">
        <img src="133.png" alt="Eevee" class="sprite">
        <svg viewBox="0 0 16 16" style="width: 13px; height: 13px;"><path d="M5 3 L11 8 L5 13" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <img src="134.png" alt="Vaporeon" class="sprite">
        <div style="display: flex; flex-direction: column; gap: 2px; margin-left: 4px;">
          <span style="font-size: 14px; font-weight: 600;">Eevee &middot; Vaporeon</span>
          <span style="display: flex; align-items: center; gap: 5px; font-size: 11px; color: #737373;"><span style="width: 8px; height: 8px; border-radius: 999px; background: #6390f0;"></span>Water</span>
        </div>
      </div>
      <div class="linecard">
        <img src="133.png" alt="Eevee" class="sprite">
        <svg viewBox="0 0 16 16" style="width: 13px; height: 13px;"><path d="M5 3 L11 8 L5 13" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <img src="135.png" alt="Jolteon" class="sprite">
        <div style="display: flex; flex-direction: column; gap: 2px; margin-left: 4px;">
          <span style="font-size: 14px; font-weight: 600;">Eevee &middot; Jolteon</span>
          <span style="display: flex; align-items: center; gap: 5px; font-size: 11px; color: #737373;"><span style="width: 8px; height: 8px; border-radius: 999px; background: #f7d02c;"></span>Electric</span>
        </div>
      </div>
      <div class="linecard">
        <img src="133.png" alt="Eevee" class="sprite">
        <svg viewBox="0 0 16 16" style="width: 13px; height: 13px;"><path d="M5 3 L11 8 L5 13" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <img src="136.png" alt="Flareon" class="sprite">
        <div style="display: flex; flex-direction: column; gap: 2px; margin-left: 4px;">
          <span style="font-size: 14px; font-weight: 600;">Eevee &middot; Flareon</span>
          <span style="display: flex; align-items: center; gap: 5px; font-size: 11px; color: #737373;"><span style="width: 8px; height: 8px; border-radius: 999px; background: #ee8130;"></span>Fire</span>
        </div>
      </div>
    </div>

    <div style="margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 0 4px;">
      <svg viewBox="0 0 16 16" style="width: 13px; height: 13px; flex-shrink: 0;"><circle cx="8" cy="8" r="7" fill="none" stroke="#a3a3a3" stroke-width="1.4"></circle><circle cx="8" cy="4.8" r="0.9" fill="#a3a3a3"></circle><rect x="7.2" y="6.8" width="1.6" height="4.6" rx="0.8" fill="#a3a3a3"></rect></svg>
      <span style="font-size: 11px; color: #a3a3a3;">Lines are grouped by branch. Tap a card to place the whole line &mdash; the card fills every stage for you.</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
