    <!-- The hub's largest paint on a phone is the first card's front screenshot.
         Without this the browser finds it only after the JavaScript renders the
         hub. Phones only: on a desktop the largest paint is the heading, and the
         image would only slow the JavaScript. `imagesrcset` and `imagesizes`
         must match the shot() call in HomePage.tsx, or the browser downloads the
         image twice. -->
    <link rel="preload" as="image" fetchpriority="high" media="(max-width: 1023px)"
      href="/src/assets/home/tool-dex.webp"
      imagesrcset="/src/assets/home/tool-dex-400.webp 400w, /src/assets/home/tool-dex.webp 800w"

    <style>
      /* These must match the LIGHT palette in src/index.css, not a dark one. That
       * file's `body` rule (background-color: var(--color-background) = #f7f7f8)
       * lives in the built stylesheet, which is linked *after* this block and
       * therefore wins — and because stylesheets are render-blocking, the values
       * here only ever paint if that stylesheet fails to load. A dark background
       * declared here is invisible in normal operation while making the boot
       * screen look dark in any test that bypasses the stylesheet. The app has no
       * dark mode: nothing applies the `.dark` class. */
      html, body { margin: 0; padding: 0; background: #f7f7f8; color: #0a0a0a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #root { min-height: 100dvh; }
      .p151-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; text-align: center; }
      .p151-boot svg { width: 64px; height: 64px; animation: p151-spin 1.1s linear infinite; }
      /* SEO-HANDOFF.md P1. This markup is the only content a crawler that does not
       * execute JS ever receives — everything else is injected by React after load,
       * and Bing (the app's #1 search referrer, ~42%) renders JS partially at best.
       * Keeping the copy visible to humans as well means it is honest content, not
       * crawler-only text. React's createRoot drops these children on first commit,
       * so it never coexists with the app's own <h1>. */
      /* The copy sits OUT of the flex flow, so the spinner and "Loading…" keep the
       * exact centring they had before this text existed.
       *
       * It also reveals after a delay. On a fast connection the app mounts in a few
       * hundred ms, so text shown immediately would only flash and vanish — visible
       * but never readable, which is worse than no text at all. Holding it back ~1s
       * means a quick load never paints it, while a slow load gets something useful
       * instead of a bare spinner.
       *
       * This is not hidden text: it paints whenever loading outlasts the delay, with
       * no display:none, no off-screen positioning and no zero height. Crawlers read
       * the DOM regardless of animation state, so indexing is unaffected. */
      .p151-copy {
        position: absolute;
        top: calc(50% + 76px);
        left: 24px;
        right: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        opacity: 0;
        animation: p151-reveal 320ms ease-out 1s forwards;
      }
      @keyframes p151-reveal { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        /* Keep the delay, drop the fade. Elsewhere in index.css reduced motion uses
         * `animation: none`, but here the animation is a timing mechanism rather than
         * decoration — removing it would restore the flash it exists to prevent. */
        .p151-copy { animation-duration: 1ms; }
      }
      .p151-boot h1 { margin: 0; font-size: 18px; font-weight: 600; color: #0a0a0a; letter-spacing: -0.01em; }
      .p151-boot p { margin: 0; max-width: 38ch; font-size: 14px; line-height: 1.5; color: #525252; }
      /* Was #a3a3a3, which predated this block rendering on a light background and
       * gave "Loading…" only ~2.3:1 contrast. #6e6e6e is the app's
       * --color-muted-foreground: 4.76:1 on #f7f7f8, AA for 13px text. */
      .p151-boot span { font-size: 13px; color: #6e6e6e; letter-spacing: 0.02em; }
      /* Desktop is a peer of mobile, not mobile-with-patches (see CLAUDE.md): the
       * spinner, headline, body and hint scale together at --breakpoint-md instead
       * of staying pinned to phone sizing on a 1440px display. Plain px + one media
       * query because this block renders before main.tsx installs the rem-based
       * root font-size knob. */
      @media (min-width: 1024px) {
        .p151-boot { gap: 20px; }
        .p151-boot svg { width: 84px; height: 84px; }
        .p151-boot h1 { font-size: 30px; }
        .p151-boot p { max-width: 46ch; font-size: 17px; }
        .p151-boot span { font-size: 14px; }
        /* Clears the taller centred spinner group at this breakpoint. */
        .p151-copy { top: calc(50% + 96px); gap: 14px; }
      }
      @keyframes p151-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="p151-boot">

        </svg>
        <div class="p151-copy">
          <h1>Make a custom Pokédex, Gym Leaders, and more</h1>

          <p>
            Build a custom regional Pokédex, create gym leader teams and trainer cards, or pick your favorite Pokémon by type and generation. Save and share your creations as PNGs.
          </p>
        </div>
        <span>Loading…</span>
      </div>
    </div>
    <script type="module" src="/src/home/main.tsx"></script>
